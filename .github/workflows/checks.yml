name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when new commits land on the same ref — avoids
# spending minutes verifying a commit that's already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:lint

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:knip

  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:astro

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check:lighthouse runs `pnpm build` internally, which runs prebuild
      # (fetch-avatar, build-og, build-icon) + `astro check` + `astro build`,
      # so this single job covers type/build verification as well.
      - run: pnpm check:lighthouse
      # Upload the report on failure so we can inspect why a regression
      # tripped the 100/100/100/100 threshold without re-running locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse/
          retention-days: 14
