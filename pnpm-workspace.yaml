# Refuse to install any package version released in the last 14 days
# (in minutes). Supply-chain hygiene against typosquats and freshly
# compromised releases. https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 20160
onlyBuiltDependencies:
  - esbuild
  - fallow
  - sharp
  - unrs-resolver
patchedDependencies:
  "@jdevalk/astro-seo-graph@2.0.0": patches/@jdevalk__astro-seo-graph@2.0.0.patch
  vite@7.3.2: patches/vite@7.3.2.patch
